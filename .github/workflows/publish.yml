# Publishes to pub.dev when a version tag is pushed: git tag v0.1.1 && git push origin v0.1.1
# The tag must match pubspec.yaml's version. pub.dev → sheen → Admin → Automated publishing must be enabled for
# Marzipane/sheen with the tag pattern v{{version}}. The very first version is published by hand (dart pub publish).
name: Publish to pub.dev

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the OIDC token pub.dev accepts instead of a password
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: The tag matches the version
        run: test "v$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')" = "${GITHUB_REF_NAME}"
      # a tag for a version published by hand (such as the first one) passes without publishing again
      - name: Is this version on pub.dev already?
        id: pub
        run: |
          on=$(curl -sf https://pub.dev/api/packages/sheen | python3 -c "import json,sys;d=json.load(sys.stdin);print('true' if any(v['version']==sys.argv[1] for v in d.get('versions',[])) else 'false')" "${GITHUB_REF_NAME#v}" || echo false)
          echo "published=$on" >> "$GITHUB_OUTPUT"
      - if: steps.pub.outputs.published != 'true'
        run: flutter analyze
      - if: steps.pub.outputs.published != 'true'
        run: flutter test
      # creates the short-lived pub.dev token from GitHub's OIDC token (PUB_TOKEN); after Flutter, so it is fresh
      - if: steps.pub.outputs.published != 'true'
        uses: dart-lang/setup-dart@v1
      - if: steps.pub.outputs.published != 'true'
        run: flutter pub publish --force
